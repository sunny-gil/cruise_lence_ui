<section class="enquiry-section py-5">
  <div class="container-fluid">
    <div class="row align-items-stretch">
      
      <!-- Left: Enquiry Form -->
    <div class="col-md-12 d-flex align-items-center px-5">
  <div class="w-100">
    <h2 class="mb-4 text-white">Enquiry Form</h2>
    <form [formGroup]="enquiryForm" (ngSubmit)="onSubmit()">

      <div class="row g-3">
        <!-- Full Name -->
   <!-- Full Name -->
<div class="col-md-6">
  <label class="form-label text-white">Full Name</label>
  <input type="text" class="form-control" formControlName="fullName">
  <div *ngIf="enquiryForm.get('fullName')?.touched && enquiryForm.get('fullName')?.invalid" class="text-danger">
    Full Name is required (min 3 characters).
  </div>
</div>

<!-- Phone -->
<div class="col-md-6">
  <label class="form-label text-white">Phone</label>
  <input type="tel" class="form-control" formControlName="phone">
  <div *ngIf="enquiryForm.get('phone')?.touched && enquiryForm.get('phone')?.invalid" class="text-danger">
    Enter a valid 10-digit phone number.
  </div>
</div>

<!-- WhatsApp -->
<div class="col-md-6">
  <label class="form-label text-white">WhatsApp</label>
  <input type="tel" class="form-control" formControlName="whatsapp">
  <div *ngIf="enquiryForm.get('whatsapp')?.touched && enquiryForm.get('whatsapp')?.invalid" class="text-danger">
    WhatsApp number must be 10 digits.
  </div>
</div>

<!-- Email -->
<div class="col-md-6">
  <label class="form-label text-white">Email</label>
  <input type="email" class="form-control" formControlName="email">
  <div *ngIf="enquiryForm.get('email')?.touched && enquiryForm.get('email')?.invalid" class="text-danger">
    Enter a valid email address.
  </div>
</div>

<!-- City -->
<div class="col-md-6">
  <label class="form-label text-white">City</label>
  <input type="text" class="form-control" formControlName="city">
  <div *ngIf="enquiryForm.get('city')?.touched && enquiryForm.get('city')?.invalid" class="text-danger">
    City is required.
  </div>
</div>

<!-- State -->
<div class="col-md-6">
  <label class="form-label text-white">State</label>
  <input type="text" class="form-control" formControlName="state">
  <div *ngIf="enquiryForm.get('state')?.touched && enquiryForm.get('state')?.invalid" class="text-danger">
    State is required.
  </div>
</div>

        <!-- Course -->
        <!-- Course (Dropdown) -->
<div class="col-12">
  <label class="form-label text-white">Course</label>
  <select class="form-control" formControlName="course">
    <option value="">-- Select Course --</option>
    <option value="Starter Track">Starter Track – Photography & Camera Basics</option>
    <option value="Course 1">Course 1</option>
    <option value="Course 2">Course 2</option>
    <option value="Course 3">Course 3</option>
  </select>
  <div *ngIf="enquiryForm.get('course')?.touched && enquiryForm.get('course')?.invalid" class="text-danger">
    Please select a course.
  </div>
</div>


        <!-- Batch Start Date -->
        <!-- <div class="col-md-6">
          <label class="form-label text-white">Batch Start Date</label>
          <input type="date" class="form-control" formControlName="batchStartDate">
        </div> -->

        <!-- Notes -->
<div class="col-12">
  <label class="form-label text-white">Notes</label>
  <textarea rows="3" class="form-control" formControlName="notes"></textarea>
  <div *ngIf="enquiryForm.get('notes')?.touched && enquiryForm.get('notes')?.invalid" class="text-danger">
    Notes are required (at least 5 characters).
  </div>
</div>


        <!-- UTM Source -->
        <!-- <div class="col-md-4">
          <label class="form-label text-white">UTM Source</label>
          <input type="text" class="form-control" formControlName="utmSource">
        </div> -->

        <!-- UTM Medium -->
        <!-- <div class="col-md-4">
          <label class="form-label text-white">UTM Medium</label>
          <input type="text" class="form-control" formControlName="utmMedium">
        </div> -->

        <!-- UTM Campaign -->
        <!-- <div class="col-md-4">
          <label class="form-label text-white">UTM Campaign</label>
          <input type="text" class="form-control" formControlName="utmCampaign">
        </div> -->

        <!-- Submit -->
        <div class="col-12">
         <button type="submit" class="btn btn-warning w-100" [disabled]="enquiryForm.invalid">
  Submit
</button>
        </div>

        <!-- Success Message -->
        <div class="col-12" *ngIf="successMessage">
          <div class="alert alert-success mt-3">
            {{ successMessage }}
          </div>
        </div>

      </div>
    </form>
  </div>
</div>


      <!-- Right: Image -->
      

    </div>
  </div>
</section>
<section>
  <div class="col-md-12 p-0 mt-5">
        <img src="assets/images/contact.png" alt="Enquiry" 
             class="img-fluid w-100 h-100" style="object-fit: contain; border-radius: 0;">
      </div>
</section>
